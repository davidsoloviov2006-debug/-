name: Deploy apps to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['kbju/**', 'pryatki/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (KBJU at root, Pryatki at /pryatki/)
        run: |
          mkdir _site
          cp -r kbju/. _site/
          mkdir _site/pryatki
          cp -r pryatki/. _site/pryatki/
          cp pryatki/index.html _site/pryatki/play.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
